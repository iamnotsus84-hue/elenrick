<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">最新イラスト・画像まとめ検索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        h1 {
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 1. 検索画面 */
        #searchView {
            text-align: center;
            padding: 40px 20px;
        }
        .search-box {
            display: inline-flex;
            width: 100%;
            max-width: 600px;
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
        }
        .search-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #c73a52; }

        /* 2. 検索結果画面 */
        #resultsView { display: none; }
        .result-item {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #e94560;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .result-item:hover {
            background: #1f2a48;
            transform: translateY(-2px);
        }
        .result-url {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }
        .result-title {
            font-size: 1.2rem;
            color: #e94560;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .result-desc {
            font-size: 0.9rem;
            color: #bbb;
        }

        /* 3. 罠ページ（まとめサイト風） */
        #trapView { display: none; }
        .warning-btn {
            display: block;
            width: 100%;
            background: #e94560;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .warning-btn:hover {
            background: #c73a52;
            transform: scale(1.02);
        }
        .warning-btn:active {
            transform: scale(0.98);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 12px;
        }
        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #e94560;
        }
        .card-info p {
            font-size: 0.85rem;
            color: #bbb;
        }

        /* ブラックアウト＆動画エリア */
        #blackout {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #rickVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
