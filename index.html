<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">えろ画像まとめサイト</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        h1 {
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 検索バー */
        .search-area {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-box {
            display: inline-flex;
            width: 100%;
            max-width: 600px;
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #c73a52; }

        /* 検索結果画面 */
        #resultsView { display: none; }
        .result-item {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #e94560;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .result-item:hover {
            background: #1f2a48;
            transform: translateY(-2px);
        }
        .result-url { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .result-title { font-size: 1.2rem; color: #e94560; font-weight: bold; margin-bottom: 5px; }
        .result-desc { font-size: 0.9rem; color: #bbb; }

        /* まとめ＆ギャラリー画面 */
        .warning-btn {
            display: block;
            width: 100%;
            background: #e94560;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .warning-btn:hover { background: #c73a52; transform: scale(1.02); }
        .warning-btn:active { transform: scale(0.98); }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .card-info { padding: 12px; }
        .card-info h3 { font-size: 1rem; margin-bottom: 5px; color: #e94560; }
        .card-info p { font-size: 0.85rem; color: #bbb; }

        /* ブラックアウト＆動画エリア */
        #blackout {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #rickVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="blackout">
        <video id="rickVideo" controls playsinline preload="auto">
            <source src="rick-roll-video-meme-template-video-1da252ec.mp4" type="video/mp4">
        </video>
    </div>

    <header>
        <h1 id="headerTitle">えろ画像まとめサイト</h1>
        <p class="subtitle" id="headerSub">最新厳選アダルトイラスト・AI生成まとめ</p>
    </header>

    <div class="container">
        <!-- 検索バー -->
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="keywordInput" class="search-input" placeholder="他のキャラ・ジャンルを検索...">
                <button id="searchBtn" class="search-btn">検索</button>
            </div>
        </div>

        <!-- 検索結果画面（フェイク記事一覧） -->
        <div id="resultsView">
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #888;">「<span id="queryEcho"></span>」の検索結果</p>
            
            <div class="result-item" onclick="showGallery()">
                <div class="result-url">https://matome-ero-ch.net/archives/2026/06/gallery</div>
                <div class="result-title"><span id="resTitle1"></span> 最新厳選まとめ・高画質イラスト・差分アリ</div>
                <div class="result-desc"><span id="resDesc1"></span>の最新の高画質画像、公式イラスト、SNS未公開の差分などを一挙にまとめました！保存版。</div>
            </div>
            <div class="result-item" onclick="showGallery()">
                <div class="result-url">https://anime-ge-matome.com/thread/gallery</div>
                <div class="result-title"><span id="resTitle2"></span> えろ画像・エロイラスト大量まとめ【随時更新】</div>
                <div class="result-desc"><span id="resDesc2"></span>のエロいシーンやプライベート姿、制服崩しなど刺激強めのイラストをまとめています。</div>
            </div>
        </div>

        <!-- メイン・罠まとめページ -->
        <div id="trapView">
            <button class="warning-btn" id="enterBtn">⚠️ 18歳未満閲覧禁止 / NSFWコンテンツ注意 → クリックして入る</button>
            <div class="gallery" id="gallerySection" style="display: none;"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://elenrick.mayonezuch.workers.dev"; // ご自身のWorker URL
        const SECRET_PASS = "secret123"; // 暗号

        let currentKeyword = "general";
        let fetchedImages = [];

        // 1. パラメータ処理（pass認証 ＆ title指定）
        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title');
        const passParam = urlParams.get('pass');

        // タブ単位の認証維持
        if (passParam === SECRET_PASS) {
            sessionStorage.setItem('tab_authenticated', 'true');
            urlParams.delete('pass');
            const remainingQuery = urlParams.toString();
            const cleanUrl = window.location.pathname + (remainingQuery ? '?' + remainingQuery : '');
            window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }

        function isTabAuthenticated() {
            return sessionStorage.getItem('tab_authenticated') === 'true';
        }

        // 初期データの読み込み
        if (titleParam && titleParam !== '1') {
            currentKeyword = titleParam;
            document.getElementById('pageTitle').textContent = titleParam + " エロ画像まとめ";
            document.getElementById('headerTitle').textContent = titleParam + " エロ画像まとめ";
            document.getElementById('headerSub').textContent = "最新厳選エロイラスト・高画質まとめ";
        }
        loadImages(currentKeyword);

        // Workerから画像を取得して描画する関数
        function loadImages(keyword) {
            fetch(`${WORKER_URL}?q=${encodeURIComponent(keyword)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.images && data.images.length > 0) {
                        fetchedImages = data.images;
                        renderGallery(fetchedImages);
                    }
                })
                .catch(err => console.error("API Error:", err));
        }

        function renderGallery(images) {
            const gallery = document.getElementById('gallerySection');
            gallery.innerHTML = '';
            images.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${url}" alt="Image ${index + 1}" loading="lazy" onerror="this.closest('.card').style.display='none'">
                    <div class="card-info">
                        <h3>厳選カット #${String(index + 1).padStart(2, '0')}</h3>
                        <p>高画質・保存版</p>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // 検索ボタンクリック時の処理
        function executeSearch() {
            const val = document.getElementById('keywordInput').value.trim();
            if (!val) return;
            currentKeyword = val;

            // テキスト反映
            document.getElementById('queryEcho').textContent = val;
            document.getElementById('resTitle1').textContent = val;
            document.getElementById('resTitle2').textContent = val;
            document.getElementById('resDesc1').textContent = val;
            document.getElementById('resDesc2').textContent = val;

            // 画面切り替え
            document.getElementById('trapView').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';
            document.getElementById('headerTitle').textContent = "「" + val + "」の検索結果";
            document.getElementById('headerSub').textContent = "検索エンジンまとめサーバー";

            // リアルタイム取得
            loadImages(val);
        }

        document.getElementById('searchBtn').addEventListener('click', executeSearch);
        document.getElementById('keywordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        // 検索結果からギャラリー（罠ページ）に戻る時
        function showGallery() {
            document.getElementById('headerTitle').textContent = currentKeyword + " エロ画像まとめ";
            document.getElementById('headerSub').textContent = "最新厳選まとめ・高画質保存版";
            document.getElementById('resultsView').style.display = 'none';
            document.getElementById('trapView').style.display = 'block';
            
            document.getElementById('enterBtn').style.display = 'block';
            document.getElementById('gallerySection').style.display = 'none';
            if (fetchedImages.length > 0) renderGallery(fetchedImages);
        }

        // 閲覧ボタン（罠のトリガー）
        document.getElementById('enterBtn').addEventListener('click', function() {
            // タブ認証済み（暗号モード）なら、動画をスキップして即ギャラリーを表示
            if (isTabAuthenticated()) {
                document.getElementById('gallerySection').style.display = 'grid';
                this.style.display = 'none';
                return;
            }

            // 未認証ならフルスクリーン＋リックロール発動
            const video = document.getElementById('rickVideo');
            const playPromise = video.play();

            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }

            document.getElementById('gallerySection').style.display = 'grid';
            this.style.display = 'none';

            setTimeout(() => {
                document.getElementById('blackout').style.display = 'flex';
                if (playPromise !== undefined) {
                    playPromise.catch(() => video.play());
                }
            }, 300);
        });
    </script>
</body>
</html>
