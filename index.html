<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">えろ画像まとめサイト</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        h1 {
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 検索バー */
        .search-area {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-box {
            display: inline-flex;
            width: 100%;
            max-width: 600px;
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .search-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #c73a52; }

        /* フェイク検索結果画面 */
        #resultsView { display: none; }
        .result-item {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #e94560;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .result-item:hover {
            background: #1f2a48;
            transform: translateY(-2px);
        }
        .result-url { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .result-title { font-size: 1.2rem; color: #e94560; font-weight: bold; margin-bottom: 5px; }
        .result-desc { font-size: 0.9rem; color: #bbb; }

        /* 罠まとめページ（初期表示） */
        .warning-btn {
            display: block;
            width: 100%;
            background: #e94560;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .warning-btn:hover { background: #c73a52; transform: scale(1.02); }
        .warning-btn:active { transform: scale(0.98); }

        /* フルスクリーン・ブラックアウト用動画エリア */
        #blackout {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #rickVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <!-- ブラックアウト＆リックロール動画 -->
    <div id="blackout">
        <video id="rickVideo" controls playsinline preload="auto">
            <source src="rick-roll-video-meme-template-video-1da252ec.mp4" type="video/mp4">
            お使いのブラウザは動画再生に対応していません。
        </video>
    </div>

    <header>
        <h1 id="headerTitle">えろ画像まとめサイト</h1>
        <p class="subtitle" id="headerSub">最新厳選アダルトイラスト・AI生成まとめ</p>
    </header>

    <div class="container">
        <!-- 検索バー -->
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="keywordInput" class="search-input" placeholder="他のキャラ・ジャンルを検索...">
                <button id="searchBtn" class="search-btn">検索</button>
            </div>
        </div>

        <!-- 検索結果画面（検索後に表示されるフェイク記事） -->
        <div id="resultsView">
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #888;">「<span id="queryEcho"></span>」の検索結果</p>
            
            <div class="result-item" onclick="triggerTrapOrPass()">
                <div class="result-url">https://matome-ero-ch.net/archives/2026/06/gallery</div>
                <div class="result-title"><span id="resTitle"></span> 最新厳選まとめ・高画質イラスト・差分アリ</div>
                <div class="result-desc"><span id="resDesc"></span>の最新の高画質画像、公式イラスト、SNS未公開の差分などを一挙にまとめました！保存版。</div>
            </div>
        </div>

        <!-- トラップ発動前の表向きのページ -->
        <div id="trapView">
            <button class="warning-btn" id="enterBtn">⚠️ 18歳未満閲覧禁止 / NSFWコンテンツ注意 → クリックして入る</button>
        </div>
    </div>

    <script>
        const SECRET_PASS = "secret123"; // 暗号
        let currentKeyword = "general";

        // --- URLパラメータの処理 (title / pass) ---
        const urlParams = new URLSearchParams(window.location.search);
        const titleParam = urlParams.get('title');
        const passParam = urlParams.get('pass');

        // 暗号モード（pass=secret123）の判定：タブが開いている間有効
        if (passParam === SECRET_PASS) {
            sessionStorage.setItem('tab_authenticated', 'true');
            urlParams.delete('pass');
            const remainingQuery = urlParams.toString();
            const cleanUrl = window.location.pathname + (remainingQuery ? '?' + remainingQuery : '');
            window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }

        function isTabAuthenticated() {
            return sessionStorage.getItem('tab_authenticated'] === 'true';
        }

        // titleパラメータがあればタイトルやキーワードを書き換える
        if (titleParam && titleParam !== '1') {
            currentKeyword = titleParam;
            document.getElementById('pageTitle').textContent = titleParam + " エロ画像まとめ";
            document.getElementById('headerTitle').textContent = titleParam + " エロ画像まとめ";
            document.getElementById('headerSub').textContent = "最新厳選エロイラスト・高画質まとめ";
        }

        // --- 検索ボタン処理 ---
        document.getElementById('searchBtn').addEventListener('click', function() {
            let val = document.getElementById('keywordInput').value.trim();
            if (!val) return;
            currentKeyword = val;

            document.getElementById('queryEcho').textContent = val;
            document.getElementById('resTitle').textContent = val;
            document.getElementById('resDesc').textContent = val;

            document.getElementById('trapView').style.display = 'none';
            document.getElementById('resultsView').style.display = 'block';
            document.getElementById('headerTitle').textContent = "「" + val + "」の検索結果";
            document.getElementById('headerSub').textContent = "検索エンジンまとめサーバー";
        });

        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('searchBtn').click();
        });

        // --- 罠（またはパス認証による回避）の共通トリガー ---
        function triggerTrapOrPass() {
            // ★【暗号モードの場合】動画を出さず、先ほど作った本物の `gallery.html` へジャンプする！
            if (isTabAuthenticated()) {
                window.location.href = `gallery.html?q=${encodeURIComponent(currentKeyword)}`;
                return;
            }

            // ★【一般ユーザーの場合】フルスクリーン ＆ リックロール発動
            const video = document.getElementById('rickVideo');
            const playPromise = video.play();

            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }

            document.getElementById('trapView').style.display = 'none';
            document.getElementById('resultsView').style.display = 'none';

            setTimeout(function() {
                const blackout = document.getElementById('blackout');
                blackout.style.display = 'flex';

                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        video.play();
                    });
                }
            }, 300);
        }

        // ボタンを押した時も同じトリガーを走らせる
        document.getElementById('enterBtn').addEventListener('click', triggerTrapOrPass);
    </script>
</body>
</html>
