<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エレン・ジョー エロ画像まとめ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        h1 {
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .warning-btn {
            display: block;
            width: 100%;
            background: #e94560;
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .warning-btn:hover {
            background: #c73a52;
            transform: scale(1.02);
        }
        .warning-btn:active {
            transform: scale(0.98);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        /* 本物の画像を表示するスタイル */
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .placeholder {
            height: 280px;
            background: linear-gradient(45deg, #0f3460, #e94560, #533483);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            position: relative;
        }
        .placeholder::after {
            content: "画像読み込み中...";
            position: absolute;
            bottom: 10px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .card-info {
            padding: 12px;
        }
        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #e94560;
        }
        .card-info p {
            font-size: 0.85rem;
            color: #bbb;
        }
        /* ブラックアウト＆動画エリア */
        #blackout {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #rickVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="blackout">
        <video id="rickVideo" controls playsinline>
            <source src="rick-roll-video-meme-template-video-1da252ec.mp4" type="video/mp4">
            お使いのブラウザは動画再生に対応していません。
        </video>
    </div>

    <header>
        <h1>エレン・ジョー エロ画像まとめ</h1>
        <p class="subtitle">Zenless Zone Zero / 最新厳選エロイラスト・AI生成まとめ</p>
    </header>

    <div class="container" id="content">
        <!-- 初めはボタンだけ -->
        <button class="warning-btn" id="enterBtn">⚠️ 18歳未満閲覧禁止 / NSFWコンテンツ注意　→　クリックして入る</button>

        <!-- ギャラリー全体（初期は非表示） -->
        <div class="gallery" id="gallerySection" style="display: none;">
            <!-- 【1番上】120910518-0.jpg -->
            <div class="card">
                <img src="120910518-0.jpg" alt="Ellen Joe #01">
                <div class="card-info">
                    <h3>特別仕様</h3>
                    <p>完全新規描き下ろし</p>
                </div>
            </div>
            <!-- 【下2番目】IMG_c8e4e718-d4d0-4fe0-b57e-225daedd73b0.jpg -->
            <div class="card">
                <img src="IMG_c8e4e718-d4d0-4fe0-b57e-225daedd73b0.jpg" alt="Ellen Joe #02">
                <div class="card-info">
                    <h3>プライベート空間</h3>
                    <p>部屋着・ゆるふわ</p>
                </div>
            </div>
            <!-- 【下3番目】IMG_f38ee226-0c85-49bd-a0c2-49cd9d89d7b7.jpg -->
            <div class="card">
                <img src="IMG_f38ee226-0c85-49bd-a0c2-49cd9d89d7b7.jpg" alt="Ellen Joe #03">
                <div class="card-info">
                    <h3>バトル後</h3>
                    <p>汗だく・ダメージ表現</p>
                </div>
            </div>
            <!-- 残りのプレースホルダー -->
            <div class="card">
                <div class="placeholder">Ellen Joe #04</div>
                <div class="card-info">
                    <h3>水着バージョン</h3>
                    <p>高画質・透け感強め / 2025年最新</p>
                </div>
            </div>
            <div class="card">
                <div class="placeholder">Ellen Joe #05</div>
                <div class="card-info">
                    <h3>制服崩し</h3>
                    <p>胸強調・太もも重点</p>
                </div>
            </div>
            <div class="card">
                <div class="placeholder">Ellen Joe #06</div>
                <div class="card-info">
                    <h3>寝起き姿</h3>
                    <p>朝の光と肌の質感</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('enterBtn').addEventListener('click', function() {
            // ボタンを押すとギャラリーがパッと表示される
            document.getElementById('gallerySection').style.display = 'grid';
            this.style.display = 'none';

            // ほんの一瞬（約0.3秒後）に見せた後、即座にブラックアウトしてリックロール発動
            setTimeout(function() {
                const blackout = document.getElementById('blackout');
                blackout.style.display = 'flex';

                const video = document.getElementById('rickVideo');
                video.play().catch(() => {});
            }, 300); // 300ms（0.3秒）
        });
    </script>
</body>
</html>
