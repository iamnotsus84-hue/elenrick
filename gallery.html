<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">画像ギャラリー - まとめ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background: #1a1a2e;
            color: #eee;
            line-height: 1.6;
            padding-bottom: 40px;
        }
        header {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        h1 {
            font-size: 1.8rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 50px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 12px;
        }
        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #e94560;
        }
        .card-info p {
            font-size: 0.85rem;
            color: #bbb;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerTitle">高画質画像ギャラリー</h1>
        <p class="subtitle" id="headerSub">最新厳選イラスト・保存版</p>
    </header>

    <div class="container">
        <div id="loading" class="loading">画像を読み込み中...</div>
        <div class="gallery" id="gallerySection"></div>
    </div>

    <script>
        const WORKER_URL = "https://elenrick.mayonezuch.workers.dev"; // ご自身のWorker URL

        // URLの ?q= からキーワードを取得（例: gallery.html?q=推しの子）
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || 'general';

        // 画面のタイトル等を更新
        document.getElementById('pageTitle').textContent = query + " - 画像ギャラリー";
        document.getElementById('headerTitle').textContent = "「" + query + "」の画像一覧";

        // Worker から画像を取得して描画
        fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                const loadingEl = document.getElementById('loading');
                const gallery = document.getElementById('gallerySection');
                loadingEl.style.display = 'none';

                if (data.images && data.images.length > 0) {
                    data.images.forEach((url, index) => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${url}" alt="Image ${index + 1}" loading="lazy" onerror="this.closest('.card').style.display='none'">
                            <div class="card-info">
                                <h3>カット #${String(index + 1).padStart(2, '0')}</h3>
                                <p>高画質保存版</p>
                            </div>
                        `;
                        gallery.appendChild(card);
                    });
                } else {
                    gallery.innerHTML = '<p style="color:#aaa; text-align:center; grid-column:1/-1;">画像が見つかりませんでした。</p>';
                }
            })
            .catch(err => {
                console.error("API Error:", err);
                document.getElementById('loading').textContent = "画像の読み込みに失敗しました。";
            });
    </script>
</body>
</html>
