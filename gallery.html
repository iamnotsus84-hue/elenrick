<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>Gallery — 画像検索</title>
  <meta name="description" content="複数の検索元から画像を探して一覧表示する画像検索サイト。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #191b23;
      --hover: #222531;
      --text: #f5f6fa;
      --muted: #a3a8b8;
      --line: #303341;
      --accent: #9b8cff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 16px clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--line); background: #101116ee;
      position: sticky; top: 0; z-index: 5; backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: #111; }
    .topnote { color: var(--muted); font-size: .82rem; }
    main { width: min(1800px, 100%); margin: auto; padding: clamp(24px, 5vw, 64px) clamp(14px, 3vw, 36px) 64px; }
    .hero { text-align: center; max-width: 820px; margin: 0 auto 30px; }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.055em; }
    .subtitle { color: var(--muted); line-height: 1.7; margin: 0; }
    .search-form { display: flex; gap: 10px; max-width: 820px; margin: 26px auto 14px; }
    .search-input-wrap { flex: 1; position: relative; min-width: 0; }
    .search-icon { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #query {
      width: 100%; min-height: 54px; border-radius: 15px; border: 1px solid var(--line);
      background: var(--panel); color: var(--text); padding: 0 16px 0 48px; outline: none;
    }
    #query:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #9b8cff22; }
    .primary { border: 0; border-radius: 15px; padding: 0 23px; min-height: 54px; background: var(--accent); color: #111; font-weight: 800; }
    .primary:hover { background: #b0a5ff; }
    button:disabled { opacity: .6; cursor: wait; }
    .toolbar { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    .safe-label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .84rem; }
    .safe-label input { accent-color: var(--accent); }
    .status-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 32px 0 10px; color: var(--muted); font-size: .9rem; }
    #status { min-height: 1.4em; overflow-wrap: anywhere; }
    #count { white-space: nowrap; }
    #providers { color: var(--muted); font-size: .78rem; line-height: 1.7; margin-bottom: 16px; overflow-wrap: anywhere; }
    #results { columns: 5 210px; column-gap: 12px; }
    .result-card {
      display: inline-block; vertical-align: top; width: 100%; margin: 0 0 12px;
      overflow: hidden; min-width: 0; break-inside: avoid;
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    }
    .result-card:hover { border-color: #555a70; }
    .image-button { display: block; width: 100%; border: 0; padding: 0; background: #0a0b0e; text-align: left; }
    .image-button img { display: block; width: 100%; height: auto; object-fit: contain; }
    .image-failed {
      min-height: 120px; display: grid; place-items: center; padding: 16px;
      color: var(--muted); text-align: center; font-size: .85rem; line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .card-meta { display: flex; align-items: center; gap: 8px; padding: 9px 10px; min-height: 40px; }
    .card-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .83rem; flex: 1; min-width: 0; }
    .source { color: var(--muted); font-size: .72rem; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
    .open-source { color: var(--muted); text-decoration: none; font-size: .78rem; flex-shrink: 0; padding: 3px; }
    .open-source:hover { color: var(--text); }
    .empty { border: 1px dashed var(--line); border-radius: 16px; padding: 42px 20px; text-align: center; color: var(--muted); line-height: 1.8; }
    .more-wrap { text-align: center; margin-top: 24px; }
    .secondary { border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; background: var(--panel); color: var(--text); }
    .secondary:hover { background: var(--hover); }
    .fineprint { max-width: 850px; margin: 38px auto 0; color: #818697; font-size: .78rem; line-height: 1.8; text-align: center; }
    dialog { width: min(1100px, calc(100vw - 24px)); max-width: none; max-height: calc(100dvh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 16px; background: #111217; color: var(--text); }
    dialog::backdrop { background: #000c; backdrop-filter: blur(5px); }
    .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    #viewerTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .viewer-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .viewer-body { display: grid; place-items: center; padding: 12px; min-height: 180px; }
    #viewerImage { display: block; max-width: 100%; max-height: calc(100dvh - 130px); width: auto; height: auto; object-fit: contain; }
    .icon-button { display: inline-block; border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; color: var(--text); background: var(--panel); text-decoration: none; white-space: nowrap; font-size: .85rem; }
    @media (max-width: 1200px) { #results { columns: 4 190px; } }
    @media (max-width: 900px) { #results { columns: 3 160px; column-gap: 10px; } .result-card { margin-bottom: 10px; } }
    @media (max-width: 560px) {
      .topbar { padding: 13px 15px; }
      .topnote { display: none; }
      .search-form { flex-direction: column; }
      .primary { width: 100%; }
      #results { columns: 2 130px; column-gap: 8px; }
      .result-card { margin-bottom: 8px; border-radius: 8px; }
      .card-meta { padding: 7px; gap: 5px; }
      .card-title { font-size: .78rem; }
      .source { display: none; }
      .viewer-head { padding: 10px; gap: 6px; }
      .viewer-actions { gap: 5px; }
      .icon-button { padding: 7px; font-size: .75rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">G</span><span>Gallery</span></div>
    <div class="topnote">画像を探す、まとめて見る。</div>
  </header>

  <main>
    <section class="hero">
      <h1>画像を、まとめて検索。</h1>
      <p class="subtitle">複数の検索元から取得できた画像を一覧表示します。</p>
      <form id="searchForm" class="search-form">
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="query" name="q" type="search" placeholder="画像を検索…" autocomplete="off" required>
        </div>
        <button class="primary" id="searchButton" type="submit">検索する</button>
      </form>
      <div class="toolbar">
        <label class="safe-label">
          <input id="safeSearch" type="checkbox">
          セーフサーチを有効にする
        </label>
      </div>
    </section>

    <section aria-live="polite">
      <div class="status-row">
        <div id="status">キーワードを入力して検索してください。</div>
        <div id="count"></div>
      </div>
      <div id="providers"></div>
      <div id="results">
        <div class="empty">キーワードを入力して検索してください。</div>
      </div>
      <div class="more-wrap">
        <button id="moreButton" class="secondary" type="button" hidden>さらに読み込む</button>
      </div>
    </section>

    <p class="fineprint">
      画像は各検索元・掲載サイトから読み込まれます。画像の権利はそれぞれの権利者に帰属します。<br>
      検索元の制限や仕様変更により、取得できない画像がある場合があります。
    </p>
  </main>

  <dialog id="viewer">
    <div class="viewer-head">
      <span id="viewerTitle">画像プレビュー</span>
      <div class="viewer-actions">
        <a id="openOriginal" class="icon-button" href="#" target="_blank" rel="noopener noreferrer">掲載元を開く ↗</a>
        <button id="closeViewer" class="icon-button" type="button">閉じる ✕</button>
      </div>
    </div>
    <div class="viewer-body"><img id="viewerImage" alt=""></div>
  </dialog>

  <script>
    const WORKER_URL = "https://elenrick.mayonezuch.workers.dev";

    const form = document.querySelector("#searchForm");
    const queryInput = document.querySelector("#query");
    const searchButton = document.querySelector("#searchButton");
    const safeSearchInput = document.querySelector("#safeSearch");
    const statusEl = document.querySelector("#status");
    const countEl = document.querySelector("#count");
    const providersEl = document.querySelector("#providers");
    const resultsEl = document.querySelector("#results");
    const moreButton = document.querySelector("#moreButton");
    const viewer = document.querySelector("#viewer");
    const viewerImage = document.querySelector("#viewerImage");
    const viewerTitle = document.querySelector("#viewerTitle");
    const openOriginal = document.querySelector("#openOriginal");
    const closeViewer = document.querySelector("#closeViewer");

    let currentQuery = "";
    let currentOffset = 0;
    let allImages = [];
    let seenUrls = new Set();
    let isLoading = false;
    let searchGeneration = 0;

    function safeHttpUrl(value) {
      try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function normalizeImage(item) {
      if (typeof item === "string") {
        const imageUrl = safeHttpUrl(item);
        return imageUrl ? {
          imageUrl, pageUrl: imageUrl, title: "画像", source: ""
        } : null;
      }

      if (!item || typeof item !== "object") return null;
      const imageUrl = safeHttpUrl(
        item.imageUrl || item.image_url || item.thumbnail ||
        item.thumbnailUrl || item.url || item.src
      );
      if (!imageUrl) return null;

      return {
        imageUrl,
        pageUrl: safeHttpUrl(
          item.pageUrl || item.page_url || item.sourceUrl ||
          item.source_url || item.link || imageUrl
        ) || imageUrl,
        title: String(item.title || item.name || "画像"),
        source: String(item.source || item.engine || "")
      };
    }

    function setLoading(value) {
      isLoading = value;
      searchButton.disabled = value;
      searchButton.textContent = value ? "検索中…" : "検索する";
      moreButton.disabled = value;
    }

    function showEmpty(message) {
      resultsEl.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = message;
      resultsEl.appendChild(empty);
    }

    function openViewer(image) {
      viewerImage.onerror = () => {
        viewerImage.alt = "画像を表示できません。掲載元を開いてください。";
      };
      viewerImage.onload = () => {
        viewerImage.alt = image.title;
      };
      viewerImage.src = image.imageUrl;
      viewerImage.alt = image.title;
      viewerTitle.textContent = image.title;
      openOriginal.href = image.pageUrl;
      if (typeof viewer.showModal === "function") viewer.showModal();
      else window.open(image.pageUrl, "_blank", "noopener");
    }

    function addImageCard(image) {
      const card = document.createElement("article");
      card.className = "result-card";

      const imageButton = document.createElement("button");
      imageButton.className = "image-button";
      imageButton.type = "button";
      imageButton.setAttribute("aria-label", image.title + "を拡大表示");

      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.alt = image.title;

      // 画像を読み込めなくてもカードは削除しない
      img.addEventListener("error", () => {
        img.hidden = true;
        let fallback = imageButton.querySelector(".image-failed");
        if (!fallback) {
          fallback = document.createElement("div");
          fallback.className = "image-failed";
          fallback.textContent = "サムネイルを読み込めませんでした。掲載元を開くか、クリックして再試行できます。";
          imageButton.appendChild(fallback);
        }
      });

      img.addEventListener("load", () => {
        img.hidden = false;
        const fallback = imageButton.querySelector(".image-failed");
        if (fallback) fallback.remove();
      });

      // 最初のエラー時にカードを消さず、再クリックで再試行
      imageButton.addEventListener("click", () => {
        if (img.hidden) {
          img.src = "";
          requestAnimationFrame(() => { img.src = image.imageUrl; });
        } else {
          openViewer(image);
        }
      });

      img.src = image.imageUrl;
      imageButton.appendChild(img);

      const meta = document.createElement("div");
      meta.className = "card-meta";

      const title = document.createElement("span");
      title.className = "card-title";
      title.textContent = image.title;
      title.title = image.title;
      meta.appendChild(title);

      if (image.source) {
        const source = document.createElement("span");
        source.className = "source";
        source.textContent = image.source;
        source.title = image.source;
        meta.appendChild(source);
      }

      const link = document.createElement("a");
      link.className = "open-source";
      link.href = image.pageUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "↗";
      link.title = "掲載元を開く";
      link.setAttribute("aria-label", "掲載元を開く");
      meta.appendChild(link);

      card.append(imageButton, meta);
      resultsEl.appendChild(card);
    }

    function appendResults(items) {
      let added = 0;

      for (const raw of items) {
        const image = normalizeImage(raw);
        if (!image) continue;

        const key = image.imageUrl.replace(/#.*$/, "");
        if (seenUrls.has(key)) continue;

        seenUrls.add(key);
        allImages.push(image);
        addImageCard(image);
        added++;
      }

      countEl.textContent = `${allImages.length} 件`;
      if (allImages.length === 0) {
        showEmpty("画像が見つかりませんでした。別のキーワードで検索してください。");
      }
      return added;
    }

    function showProviders(providers) {
      if (!Array.isArray(providers)) {
        providersEl.textContent = "";
        return;
      }

      providersEl.textContent = providers.map(p =>
        `${p.name}: ${p.ok ? `${p.count}件取得` : `取得失敗${p.error ? "（" + p.error + "）" : ""}`}`
      ).join("　 /　 ");
    }

    async function runSearch({ append = false } = {}) {
      const query = queryInput.value.trim();
      if (!query || isLoading) return;

      if (!append) {
        searchGeneration++;
        currentQuery = query;
        currentOffset = 0;
        allImages = [];
        seenUrls = new Set();
        resultsEl.replaceChildren();
        countEl.textContent = "";
        providersEl.textContent = "";
        moreButton.hidden = true;
      }

      const generation = searchGeneration;
      setLoading(true);
      statusEl.textContent = append ? "追加の画像を取得しています…" : "画像を取得しています…";

      try {
        const url = new URL(WORKER_URL);
        url.searchParams.set("q", currentQuery);
        url.searchParams.set("safesearch", safeSearchInput.checked ? "on" : "off");
        url.searchParams.set("offset", String(currentOffset));

        const response = await fetch(url.toString(), {
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (generation !== searchGeneration) return;

        const items = Array.isArray(data)
          ? data
          : Array.isArray(data.images) ? data.images : [];

        const added = appendResults(items);
        showProviders(data.providers);

        if (!Array.isArray(data)) {
          currentOffset = Number(data.nextOffset ?? currentOffset + 30);
          moreButton.hidden = data.hasMore !== true;
        } else {
          moreButton.hidden = true;
        }

        if (allImages.length > 0) {
          statusEl.textContent = `「${currentQuery}」の検索結果`;
          if (added === 0 && append) {
            statusEl.textContent += "（新しい画像はありません。検索元が同じ結果を返した可能性があります）";
          }
        } else {
          statusEl.textContent = "画像を取得できませんでした。検索元の状態を確認してください。";
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = `検索に失敗しました: ${error.message || "不明なエラー"}`;
        if (allImages.length === 0) {
          showEmpty("WorkerのURL、CORS設定、または検索元の応答を確認してください。");
        }
      } finally {
        setLoading(false);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      runSearch();
    });

    moreButton.addEventListener("click", () => {
      if (!isLoading) runSearch({ append: true });
    });

    closeViewer.addEventListener("click", () => viewer.close());

    viewer.addEventListener("click", event => {
      if (event.target === viewer) viewer.close();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && viewer.open) viewer.close();
    });

    const initialQuery = new URLSearchParams(location.search).get("q");
    if (initialQuery) {
      queryInput.value = initialQuery;
      runSearch();
    }
  </script>
</body>
</html>
